name: Watchdog — Garantir posts nos horários

# O cron nativo do GitHub Actions atrasa horas. Este watchdog roda com frequência
# e, a cada execução, pergunta ao src/slot_gate.py se há post de feed devido
# (slots vencidos hoje > posts de feed já publicados hoje). Se houver, dispara
# o pipeline principal com gate=true, que confere de novo antes de publicar.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  watchdog:
    name: Verificar e disparar se necessário
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            src/slot_gate.py
            src/reel_queue.py
            data/reel_queue.json
          sparse-checkout-cone-mode: false

      - name: Há post de feed devido?
        id: gate
        env:
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python3 src/slot_gate.py

      - name: Disparar pipeline principal
        if: steps.gate.outputs.due == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run auto-post.yml --repo "${{ github.repository }}" -f mode=feed -f gate=true

      - name: Há reel devido?
        id: reel
        env:
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python3 src/reel_queue.py due

      - name: Disparar reel da fila
        if: steps.reel.outputs.reel_due == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run reel-queue.yml --repo "${{ github.repository }}"

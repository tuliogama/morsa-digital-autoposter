name: Morsa Digital — Auto Post

on:
  schedule:
    # Horários em UTC (Brasil = UTC-3) — 6 runs/dia × 2 posts = 12 posts/dia
    - cron: "0 11 * * *"    # 08h00 BRT
    - cron: "30 13 * * *"   # 10h30 BRT
    - cron: "0 16 * * *"    # 13h00 BRT
    - cron: "0 19 * * *"    # 16h00 BRT
    - cron: "0 22 * * *"    # 19h00 BRT
    - cron: "30 0 * * *"    # 21h30 BRT

  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (não publica)"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
      platforms:
        description: "Plataformas"
        required: false
        default: "instagram"
      skip_brief:
        description: "Pular análise CMO (usar brief do dia se disponível)"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

jobs:
  post:
    name: CMO → Curadoria → Publicação
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write   # necessário para commitar posts_log.json de volta ao repo
    # Evita runs simultâneos que causariam posts duplicados
    concurrency:
      group: morsa-post
      cancel-in-progress: false

    steps:
      - name: Checkout (com histórico para commit de log)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Executar ciclo CMO completo
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IMGUR_CLIENT_ID: ${{ secrets.IMGUR_CLIENT_ID }}
          MORSA_BROADCAST_CHANNEL_ID: ${{ secrets.MORSA_BROADCAST_CHANNEL_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          POSTS_PER_RUN: "3"
          DELAY_BETWEEN_POSTS: "90"
        run: |
          PLATFORMS="${{ inputs.platforms || 'instagram' }}"
          SKIP_BRIEF="${{ inputs.skip_brief || 'false' }}"
          CMD="python src/main.py --platforms $PLATFORMS"
          [ "${{ inputs.dry_run }}" = "true" ] && CMD="$CMD --dry-run"
          [ "$SKIP_BRIEF" = "true" ] && CMD="$CMD --skip-brief"
          $CMD

      # Persiste posts_log.json e day_brief.json no repo para dedup cross-run
      - name: Persistir log de posts no repositório
        if: ${{ inputs.dry_run != 'true' }}
        run: |
          git config user.name "morsa-bot"
          git config user.email "bot@morsadigital.com"
          git add logs/posts_log.json logs/day_brief.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "chore: atualiza posts_log e day_brief [skip ci]"
          git push origin main 2>/dev/null || true

      - name: Upload logs de run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-logs-${{ github.run_id }}
          path: logs/run_*.json
          retention-days: 30
      - name: Salvar log de posts (anti-duplicata)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add logs/posts_log.json || true
          git diff --cached --quiet || git commit -m "log: atualizar posts_log após run [skip ci]"
          git push || true

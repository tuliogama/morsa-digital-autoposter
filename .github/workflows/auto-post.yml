name: Morsa Digital — Auto Post

on:
  schedule:
    # Feed posts: 4x/dia — baseado em análise real de 200 posts (jun/2026)
    - cron: "0 12 * * *"    # 09h00 BRT ← 46 avg likes
    - cron: "0 13 * * *"    # 10h00 BRT ← 62 avg likes
    - cron: "0 21 * * *"    # 18h00 BRT ← 243 avg likes (MELHOR JANELA)
    - cron: "0 0 * * *"     # 21h00 BRT ← 116 avg likes (2ª melhor)
    # Carrossel editorial: 2x/dia — 10h30 BRT (eleva a manhã) + 18h30 BRT (pico noturno)
    - cron: "30 13 * * *"   # 10h30 BRT → carrossel (manhã)
    - cron: "30 21 * * *"   # 18h30 BRT → carrossel (noite)
    # Reel: diário às 18h BRT — usa o mesmo gatilho 0 21 * * * do feed (job reel
    # casa com esse cron via 'if'); backlog curado + fallback RSS de trailers

  workflow_dispatch:
    inputs:
      mode:
        description: "Modo de publicação"
        required: false
        default: "feed"
        type: choice
        options: ["feed", "carousel", "reel", "carousel_deep_dive", "carousel_event"]
      dry_run:
        description: "Dry run (não publica)"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
      platforms:
        description: "Plataformas (apenas para feed)"
        required: false
        default: "instagram"

env:
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
  FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
  IG_USER_ID: ${{ secrets.IG_USER_ID }}
  IMGUR_CLIENT_ID: ${{ secrets.IMGUR_CLIENT_ID }}
  MORSA_BROADCAST_CHANNEL_ID: ${{ secrets.MORSA_BROADCAST_CHANNEL_ID }}
  GITHUB_REPOSITORY: ${{ github.repository }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  BING_SEARCH_KEY: ${{ secrets.BING_SEARCH_KEY }}

jobs:
  # ── Job 1: Posts de feed (notícias automáticas) ──────────────────────────
  feed-post:
    name: Feed — Notícias automáticas
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: morsa-post
      cancel-in-progress: false
    # Roda nos horários de feed OU quando mode=feed no manual trigger
    if: >
      (github.event_name == 'schedule' && (
        github.event.schedule == '0 12 * * *' ||
        github.event.schedule == '0 13 * * *' ||
        github.event.schedule == '0 21 * * *' ||
        github.event.schedule == '0 0 * * *'
      )) ||
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'feed') ||
      (github.event_name == 'workflow_dispatch' && inputs.mode == '')

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - run: pip install -r requirements.txt

      - name: Publicar posts de feed
        env:
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          POSTS_PER_RUN: "2"
          DELAY_BETWEEN_POSTS: "90"
        run: |
          PLATFORMS="${{ inputs.platforms || 'instagram' }}"
          CMD="python src/main.py --platforms $PLATFORMS"
          [ "${{ inputs.dry_run }}" = "true" ] && CMD="$CMD --dry-run"
          $CMD

      - name: Persistir log
        if: ${{ inputs.dry_run != 'true' }}
        run: |
          git config user.name "morsa-bot"
          git config user.email "bot@morsadigital.com"
          git fetch origin main
          git stash || true
          git rebase origin/main || git reset --hard origin/main
          git stash pop || true
          git add -f logs/posts_log.json logs/day_brief.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "chore: atualiza posts_log [skip ci]"
          git push origin main || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: feed-logs-${{ github.run_id }}
          path: logs/run_*.json
          retention-days: 14

  # ── Job 2: Carrossel Editorial ───────────────────────────────────────────
  carousel:
    name: Editorial — Carrossel
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    concurrency:
      group: morsa-editorial
      cancel-in-progress: false
    if: >
      (github.event_name == 'schedule' && (
        github.event.schedule == '30 13 * * *' ||
        github.event.schedule == '30 21 * * *'
      )) ||
      (github.event_name == 'workflow_dispatch' && (
        inputs.mode == 'carousel' ||
        inputs.mode == 'carousel_deep_dive' ||
        inputs.mode == 'carousel_event'
      ))

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - run: pip install -r requirements.txt

      - name: Publicar carrossel editorial
        env:
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: |
          # Determinar tipo de carrossel
          MODE="${{ inputs.mode || 'carousel' }}"
          if [ "$MODE" = "carousel_deep_dive" ]; then
            CTYPE="deep_dive"
          elif [ "$MODE" = "carousel_event" ]; then
            CTYPE="event_recap"
          else
            CTYPE="top_n"
          fi

          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "DRY RUN — carrossel tipo: $CTYPE (sem publicação)"
          else
            python -c "
          import sys, logging
          sys.path.insert(0, 'src')
          logging.basicConfig(level=logging.INFO, format='%(asctime)s [%(levelname)s] %(name)s: %(message)s')
          from editorial import run_carousel
          result = run_carousel(carousel_type='$CTYPE')
          print('Carrossel publicado:', result)
          "
          fi

      - name: Persistir log
        if: ${{ inputs.dry_run != 'true' }}
        run: |
          git config user.name "morsa-bot"
          git config user.email "bot@morsadigital.com"
          git fetch origin main
          git stash || true
          git rebase origin/main || git reset --hard origin/main
          git stash pop || true
          git add -f logs/posts_log.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "chore: log carrossel [skip ci]"
          git push origin main || true

  # ── Job 3: Reel ─────────────────────────────────────────────────────────
  reel:
    name: Editorial — Reel
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    concurrency:
      group: morsa-reel
      cancel-in-progress: false
    if: >
      (github.event_name == 'schedule' && github.event.schedule == '0 21 * * *') ||
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'reel')

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - run: pip install -r requirements.txt

      - name: Instalar ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg || { sleep 15; sudo apt-get update -qq; sudo apt-get install -y --fix-missing ffmpeg; }

      - name: Validar backlog antes de publicar
        run: python3 validate_backlog.py

      - name: Publicar reel
        env:
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "DRY RUN — reel (sem publicação)"
          else
            python -c "
          import sys, logging
          sys.path.insert(0, 'src')
          logging.basicConfig(level=logging.INFO, format='%(asctime)s [%(levelname)s] %(name)s: %(message)s')
          from editorial import run_reel
          result = run_reel()
          print('Reel publicado:', result)
          "
          fi

      - name: Persistir log
        if: ${{ inputs.dry_run != 'true' }}
        run: |
          git config user.name "morsa-bot"
          git config user.email "bot@morsadigital.com"
          git fetch origin main
          git stash || true
          git rebase origin/main || git reset --hard origin/main
          git stash pop || true
          git add -f logs/posts_log.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "chore: log reel [skip ci]"
          git push origin main || true

  # ── Job 4: Posts de Estreia (ESTREIA HOJE + Trailer do Dia) ─────────────
  release-posts:
    name: Estreia Hoje — Feed + Reel
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    concurrency:
      group: morsa-release
      cancel-in-progress: false
    # Roda todos os dias às 09h BRT (12h UTC) — verifica se tem estreia hoje
    if: >
      (github.event_name == 'schedule' && github.event.schedule == '0 12 * * *') ||
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'release')

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - run: pip install -r requirements.txt

      - name: Instalar ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg || { sleep 15; sudo apt-get update -qq; sudo apt-get install -y --fix-missing ffmpeg; }

      - name: Verificar estreias hoje
        run: |
          python3 -c "
          import sys, json
          sys.path.insert(0, 'src')
          from release_posts import get_releases_today
          releases = get_releases_today()
          if releases:
              print(f'ESTREIAS HOJE: {[r[\"titulo\"] for r in releases]}')
          else:
              print('Sem estreias hoje.')
          "

      - name: Publicar posts de estreia
        env:
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python3 -c "
          import sys, logging
          sys.path.insert(0, 'src')
          logging.basicConfig(level=logging.INFO, format='%(asctime)s [%(levelname)s] %(name)s: %(message)s')
          from release_posts import run_release_posts
          run_release_posts(dry_run=True)
          "
          else
            python3 -c "
          import sys, logging
          sys.path.insert(0, 'src')
          logging.basicConfig(level=logging.INFO, format='%(asctime)s [%(levelname)s] %(name)s: %(message)s')
          from release_posts import run_release_posts
          results = run_release_posts(dry_run=False)
          print(f'Publicados: {len(results)}')
          for r in results:
              print(f'  {r[\"tipo\"]}: {r[\"titulo\"]}')
          "
          fi

      - name: Persistir log e calendário
        if: ${{ inputs.dry_run != 'true' }}
        run: |
          git config user.name "morsa-bot"
          git config user.email "bot@morsadigital.com"
          git fetch origin main
          git stash || true
          git rebase origin/main || git reset --hard origin/main
          git stash pop || true
          git add -f logs/posts_log.json data/release_calendar.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "chore: estreia publicada — atualiza calendário [skip ci]"
          git push origin main || true

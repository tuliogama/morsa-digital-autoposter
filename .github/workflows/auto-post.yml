name: Morsa Digital — Auto Post

on:
  schedule:
    # Horários em UTC (Brasil = UTC-3) — 6 posts/dia
    # 08:00 BRT = 11:00 UTC
    # 10:30 BRT = 13:30 UTC
    # 13:00 BRT = 16:00 UTC
    # 16:00 BRT = 19:00 UTC
    # 19:00 BRT = 22:00 UTC
    # 21:30 BRT = 00:30 UTC
    - cron: "0 11 * * *"    # 08h BRT
    - cron: "30 13 * * *"   # 10h30 BRT
    - cron: "0 16 * * *"    # 13h BRT
    - cron: "0 19 * * *"    # 16h BRT
    - cron: "0 22 * * *"    # 19h BRT
    - cron: "30 0 * * *"    # 21h30 BRT

  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (não publica)"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
      platforms:
        description: "Plataformas (separadas por vírgula)"
        required: false
        default: "instagram"

jobs:
  post:
    name: Gerar e publicar posts
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Executar autoposter
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_SECRET: ${{ secrets.TWITTER_ACCESS_SECRET }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_DEFAULT_IMAGE_URL: ${{ secrets.IG_DEFAULT_IMAGE_URL }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: |
          PLATFORMS="${{ inputs.platforms || 'instagram' }}"
          python src/main.py --platforms "$PLATFORMS" ${{ inputs.dry_run == 'true' && '--dry-run' || '' }}

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-logs-${{ github.run_id }}
          path: logs/
          retention-days: 30

name: Reels diários — publica das filas

# O Mac abastece as filas (vídeos de canais oficiais já convertidos e hospedados
# na Release "reel-queue"). Aqui só se publica, 1 reel por dia de cada fluxo:
#   cenas (data/reel_queue_cenas.json) a partir das 11h BRT
#   main  (data/reel_queue.json)       a partir das 13h BRT
# Crons são gatilhos; src/reel_queue.py decide o que é devido.

on:
  schedule:
    # Alvo: 11h BRT (14h UTC). O cron do GitHub atrasa, e mais ainda na hora cheia,
    # então há vários gatilhos fora da hora cheia; o primeiro que chegar depois
    # das 11h publica e os outros saem sem fazer nada.
    - cron: "7,27,47 14-18 * * *"
    - cron: "17 19,21,23 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Publicar agora, mesmo fora do horário ou já tendo saído reel hoje"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

env:
  REEL_FORCE: ${{ inputs.force || 'false' }}
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
  IG_USER_ID: ${{ secrets.IG_USER_ID }}
  MORSA_BROADCAST_CHANNEL_ID: ${{ secrets.MORSA_BROADCAST_CHANNEL_ID }}
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}

jobs:
  publish:
    name: Publicar reels devidos
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: morsa-reel
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Há reel devido?
        id: gate
        run: python3 src/reel_queue.py due

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.reel_due == 'true'
        with:
          python-version: "3.12"
          cache: "pip"

      - if: steps.gate.outputs.reel_due == 'true'
        run: pip install -r requirements.txt

      - name: Publicar
        if: steps.gate.outputs.reel_due == 'true'
        run: python src/reel_queue.py publish

      - name: Persistir fila e log
        if: steps.gate.outputs.reel_due == 'true'
        run: |
          git config user.name "morsa-bot"
          git config user.email "bot@morsadigital.com"
          git add data/reel_queue.json data/reel_queue_cenas.json
          git add -f logs/posts_log.json
          git diff --staged --quiet || git commit -m "chore: reel publicado da fila [skip ci]"
          # O registro é um JSON que vários fluxos escrevem. No conflito vale a versão
          # deste job e, em seguida, as entradas da cópia do GitHub são reunidas a ela:
          # ninguém perde entrada e nunca sobra marcador de conflito no arquivo.
          for i in 1 2 3 4; do
            git fetch origin main
            git show origin/main:logs/posts_log.json > /tmp/upstream_log.json 2>/dev/null || echo "[]" > /tmp/upstream_log.json
            if git rebase -X theirs origin/main; then
              python3 src/posts_log.py union /tmp/upstream_log.json
              git add -f logs/posts_log.json
              git diff --staged --quiet || git commit -m "chore: une posts_log [skip ci]"
              git push origin main && exit 0
            else
              git rebase --abort 2>/dev/null || true
            fi
            echo "push falhou (tentativa $i)"; sleep $((i*15))
          done
          exit 1
